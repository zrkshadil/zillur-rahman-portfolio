<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#e5c05b" />
    </linearGradient>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="110" fill="url(#navyBg)" />
  <!-- Outer Gold Accent Rim -->
  <rect x="20" y="20" width="472" height="472" rx="94" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85" />
  <!-- Inner subtle border -->
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  <!-- Monogram ZR -->
  <text x="50%" y="60%" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="220" font-weight="700" fill="url(#goldGrad)" letter-spacing="4">ZR</text>
  <!-- Subtle scale accent line -->
  <circle cx="256" cy="390" r="8" fill="url(#goldGrad)" />
  <line x1="216" y1="390" x2="296" y2="390" stroke="url(#goldGrad)" stroke-width="3" opacity="0.7"/>
</svg>